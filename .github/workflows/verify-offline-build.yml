name: Verify fully offline Windows build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-offline-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false

      - name: Prepare vendored dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go mod download
          if ($LASTEXITCODE -ne 0) { throw "go mod download failed" }
          go mod vendor
          if ($LASTEXITCODE -ne 0) { throw "go mod vendor failed" }
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          $env:GOBIN = (Resolve-Path tools/bin).Path
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          if ($LASTEXITCODE -ne 0) { throw "goversioninfo install failed" }
          if (-not (Test-Path vendor/modules.txt)) { throw "vendor/modules.txt missing" }
          if (-not (Test-Path tools/bin/goversioninfo.exe)) { throw "goversioninfo.exe missing" }

      - name: Prove Windows build works fully offline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:HTTP_PROXY -ErrorAction SilentlyContinue
          Remove-Item Env:HTTPS_PROXY -ErrorAction SilentlyContinue
          Remove-Item Env:ALL_PROXY -ErrorAction SilentlyContinue
          $env:NO_PROXY = "*"
          $env:GOPROXY = "off"
          $env:GOSUMDB = "off"
          $env:GOFLAGS = "-mod=vendor"
          $emptyModCache = Join-Path $env:RUNNER_TEMP "tasknotifier-empty-modcache"
          if (Test-Path $emptyModCache) { Remove-Item -Recurse -Force $emptyModCache }
          New-Item -ItemType Directory -Force $emptyModCache | Out-Null
          $env:GOMODCACHE = $emptyModCache
          go clean -cache
          if ($LASTEXITCODE -ne 0) { throw "go clean failed" }
          go test ./internal/tasknotifier
          if ($LASTEXITCODE -ne 0) { throw "offline package compile failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -buildvcs=false -trimpath -o dist/TaskNotifier.exe ./cmd/tasknotifier
          if ($LASTEXITCODE -ne 0) { throw "offline Windows build failed" }
          if (-not (Test-Path dist/TaskNotifier.exe)) { throw "TaskNotifier.exe missing" }
          if ((Get-Item dist/TaskNotifier.exe).Length -le 0) { throw "TaskNotifier.exe is empty" }
          Write-Host "Offline Windows build verified: $((Get-Item dist/TaskNotifier.exe).Length) bytes"

      - name: Create dependency artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force offline-artifact | Out-Null
          Copy-Item vendor offline-artifact/vendor -Recurse
          New-Item -ItemType Directory -Force offline-artifact/tools/bin | Out-Null
          Copy-Item tools/bin/goversioninfo.exe offline-artifact/tools/bin/goversioninfo.exe
          Copy-Item dist/TaskNotifier.exe offline-artifact/TaskNotifier-CI.exe
          @"
          Verified by GitHub Actions with:
          GOPROXY=off
          GOSUMDB=off
          GOFLAGS=-mod=vendor
          empty GOMODCACHE
          HTTP_PROXY/HTTPS_PROXY/ALL_PROXY removed
          "@ | Set-Content -Encoding UTF8 offline-artifact/OFFLINE-CI-VERIFIED.txt

      - name: Upload verified offline dependencies
        uses: actions/upload-artifact@v4
        with:
          name: tasknotifier-offline-dependencies
          path: offline-artifact
          if-no-files-found: error
