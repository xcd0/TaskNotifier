name: Build fully offline TaskNotifier package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-offline-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false

      - name: Prepare vendored dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go mod download
          if ($LASTEXITCODE -ne 0) { throw "go mod download failed" }
          go mod vendor
          if ($LASTEXITCODE -ne 0) { throw "go mod vendor failed" }
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          $env:GOBIN = (Resolve-Path tools/bin).Path
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          if ($LASTEXITCODE -ne 0) { throw "goversioninfo install failed" }
          if (-not (Test-Path vendor/modules.txt)) { throw "vendor/modules.txt missing" }
          if (-not (Test-Path tools/bin/goversioninfo.exe)) { throw "goversioninfo.exe missing" }

      - name: Build EXE and PWA fully offline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:HTTP_PROXY -ErrorAction SilentlyContinue
          Remove-Item Env:HTTPS_PROXY -ErrorAction SilentlyContinue
          Remove-Item Env:ALL_PROXY -ErrorAction SilentlyContinue
          $env:NO_PROXY = "*"
          $env:GOPROXY = "off"
          $env:GOSUMDB = "off"
          $env:GOFLAGS = "-mod=vendor"
          $emptyModCache = Join-Path $env:RUNNER_TEMP "tasknotifier-empty-modcache"
          if (Test-Path $emptyModCache) { Remove-Item -Recurse -Force $emptyModCache }
          New-Item -ItemType Directory -Force $emptyModCache | Out-Null
          $env:GOMODCACHE = $emptyModCache
          go clean -cache
          if ($LASTEXITCODE -ne 0) { throw "go clean failed" }
          go test ./internal/tasknotifier
          if ($LASTEXITCODE -ne 0) { throw "offline package compile failed" }
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { throw "offline build.ps1 failed" }

      - name: Verify combined release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseZip = Get-ChildItem "dist/TaskNotifier-v*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $releaseZip) { throw "combined EXE + PWA release ZIP missing" }
          $verify = Join-Path $env:RUNNER_TEMP "tasknotifier-release-verify"
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          Expand-Archive $releaseZip.FullName -DestinationPath $verify
          $exePath = Join-Path $verify "exe/TaskNotifier.exe"
          $pwaPath = Join-Path $verify "pwa/index.html"
          if (-not (Test-Path $exePath)) { throw "TaskNotifier.exe missing from release ZIP" }
          if (-not (Test-Path $pwaPath)) { throw "PWA index.html missing from release ZIP" }
          if ((Get-Item $exePath).Length -le 0) { throw "TaskNotifier.exe is empty" }
          Write-Host "Verified release: $($releaseZip.Name)"
          Write-Host "EXE bytes: $((Get-Item $exePath).Length)"

      - name: Create downloadable project ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseZip = Get-ChildItem "dist/TaskNotifier-v*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $releaseZip) { throw "release ZIP missing" }
          $tokyo = [System.TimeZoneInfo]::FindSystemTimeZoneById("Tokyo Standard Time")
          $stamp = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tokyo).ToString("yyyyMMdd-HHmm")
          $rootName = "TaskNotifier-Project-$stamp"
          $root = Join-Path $env:RUNNER_TEMP $rootName
          New-Item -ItemType Directory -Force "$root/source/tasknotifier" | Out-Null
          New-Item -ItemType Directory -Force "$root/release" | Out-Null

          Copy-Item * "$root/source/tasknotifier" -Recurse -Force
          if (Test-Path "$root/source/tasknotifier/dist") { Remove-Item "$root/source/tasknotifier/dist" -Recurse -Force }
          Copy-Item $releaseZip.FullName "$root/release/$($releaseZip.Name)" -Force

          @"
          TaskNotifier fully offline build package

          GitHub Actions verified this source with:
          - HTTP_PROXY / HTTPS_PROXY / ALL_PROXY removed
          - GOPROXY=off
          - GOSUMDB=off
          - GOFLAGS=-mod=vendor
          - empty GOMODCACHE
          - go clean -cache
          - go test ./internal/tasknotifier
          - scripts/build.ps1

          release/ contains the EXE + PWA ZIP built from this exact source.
          source/tasknotifier/vendor/ and tools/bin/goversioninfo.exe are included.
          "@ | Set-Content -Encoding UTF8 "$root/OFFLINE-BUILD-VERIFIED.txt"

          $projectZip = Join-Path $env:RUNNER_TEMP "$rootName.zip"
          Compress-Archive -Path $root -DestinationPath $projectZip
          "PROJECT_ZIP=$projectZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROJECT_NAME=$rootName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload TaskNotifier project
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}
          path: ${{ env.PROJECT_ZIP }}
          if-no-files-found: error
          compression-level: 0
